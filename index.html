<style>
  :root {
    --h: 333;
    --b1: hsl(var(--h) 10% 10%);
    --b2: hsl(var(--h) 10% 14%);
    --b3: hsl(var(--h) 10% 18%);
    --b4: hsl(var(--h) 10% 23%);
    --b5: hsl(var(--h) 10% 30%);
    --c1: hsl(var(--h) 10% 92%);
    --c2: hsl(var(--h) 10% 72%);
    --c3: hsl(var(--h) 10% 55%);
    --pink: #ff66ab;
    --blue: #66ccff;
    --lime: #b3ff66;
    --amber: #ffd966;
    --orange: #ff9966;
    --radius: 10px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--b1); }
  body { margin: 0; background: var(--b1); color: var(--c1); font: 15px/1.45 Nunito, system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  svg { display: block; }

  /* top bar */
  .nav { position: sticky; top: 0; z-index: 20; background: hsl(var(--h) 10% 12% / .92); backdrop-filter: blur(8px);
         border-bottom: 1px solid var(--b3); }
  .nav-in { max-width: 1240px; margin: 0 auto; padding: 0 16px; height: 56px; display: flex; align-items: center; gap: 22px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 900; font-size: 1.15rem; letter-spacing: .01em; }
  .mono { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-weight: 900; font-size: .9rem;
          background: linear-gradient(135deg, var(--pink), #a855f7); color: #fff; }
  .nav-links { display: flex; gap: 18px; font-weight: 700; color: var(--c2); }
  .nav-links a { text-decoration: none; padding: 17px 0 15px; border-bottom: 2px solid transparent; }
  .nav-links a:hover { color: var(--c1); }
  .nav-links a.on { color: var(--c1); border-color: var(--pink); }
  .nav-gh { margin-left: auto; color: var(--c2); }
  .nav-gh:hover { color: var(--c1); }

  /* page header strip */
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
  .strip { margin-top: 20px; border-radius: var(--radius) var(--radius) 0 0; padding: 14px 20px;
           background: linear-gradient(90deg, hsl(var(--h) 40% 26%), hsl(280 30% 22%)); display: flex; align-items: center; gap: 12px; }
  .strip svg { color: var(--pink); }
  .strip h1 { margin: 0; font-size: 1.25rem; font-weight: 800; }
  .strip h1 span { color: var(--c2); font-weight: 600; }

  /* search panel */
  .search { position: relative; overflow: hidden; background: var(--b2); padding: 22px 20px 16px; }
  .search-bg { position: absolute; inset: -20px; background-size: cover; background-position: center; filter: blur(14px) brightness(.35) saturate(1.2);
               transform: scale(1.05); transition: background-image .4s; }
  .search > :not(.search-bg) { position: relative; }
  .sbox { display: flex; align-items: center; gap: 10px; background: hsl(var(--h) 10% 8% / .75); border-radius: 999px; padding: 0 20px;
          border: 2px solid transparent; transition: border-color .15s; }
  .sbox:focus-within { border-color: var(--pink); }
  .sbox input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--c1); font: 600 1.15rem Nunito, sans-serif; padding: 13px 0; }
  .sbox input::placeholder { color: var(--c3); }
  .sbox kbd { font: 700 .75rem Nunito, sans-serif; color: var(--c3); border: 1px solid var(--b5); border-radius: 5px; padding: 1px 7px; }
  .sbox svg { color: var(--c2); flex: none; }
  .filters { margin-top: 14px; display: grid; gap: 6px; }
  .frow { display: grid; grid-template-columns: 90px 1fr; align-items: baseline; gap: 10px; }
  .frow > span { color: var(--c2); font-weight: 700; font-size: .85rem; }
  .opts { display: flex; flex-wrap: wrap; gap: 2px 4px; }
  .opt { background: none; border: 0; cursor: pointer; padding: 3px 8px; border-radius: 6px; font-weight: 700; font-size: .9rem; color: var(--c1); opacity: .75; }
  .opt:hover { opacity: 1; background: hsl(0 0% 100% / .06); }
  .opt.on { opacity: 1; color: var(--pink); }
  .opt:focus-visible, .sort:focus-visible, .act:focus-visible, .card:focus-within { outline: 2px solid var(--blue); outline-offset: 2px; }

  /* sort bar */
  .sortbar { background: var(--b3); padding: 10px 20px; display: flex; align-items: center; gap: 4px 6px; flex-wrap: wrap;
             border-radius: 0 0 var(--radius) var(--radius); font-size: .88rem; }
  .sortbar .lbl { color: var(--c2); font-weight: 700; margin-right: 4px; }
  .sort { background: none; border: 0; cursor: pointer; padding: 4px 8px; border-radius: 6px; font-weight: 700; color: var(--c2); display: inline-flex; align-items: center; gap: 4px; }
  .sort:hover { color: var(--c1); }
  .sort.on { color: var(--c1); background: var(--b4); }
  .sort .ar { font-size: .7rem; opacity: 0; }
  .sort.on .ar { opacity: 1; }
  .count { margin-left: auto; color: var(--c3); font-weight: 700; }

  /* cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 540px), 1fr)); gap: 14px; padding: 20px 0 10px; }
  .card { position: relative; display: flex; height: 130px; border-radius: var(--radius); overflow: hidden; background: var(--b3);
          box-shadow: 0 2px 10px hsl(0 0% 0% / .35); transition: transform .15s ease, box-shadow .15s ease; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px hsl(0 0% 0% / .5); }
  .thumb { position: relative; flex: none; width: 130px; background: var(--b4) center / cover; display: block; }
  .thumb::after { content: ""; position: absolute; inset: 0; background: hsl(0 0% 0% / .45); opacity: 0; transition: opacity .15s; }
  .thumb .pl { position: absolute; inset: 0; display: grid; place-items: center; z-index: 1; opacity: 0; transition: opacity .15s; color: #fff; }
  .card:hover .thumb::after, .card:hover .thumb .pl, .thumb:focus-visible .pl { opacity: 1; }
  .body { position: relative; flex: 1; min-width: 0; padding: 10px 14px; display: flex; flex-direction: column; overflow: hidden; }
  .body::before { content: ""; position: absolute; inset: 0; background: var(--cover) center / cover; opacity: .18; filter: blur(1px); }
  .body::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--b3) 10%, hsl(var(--h) 10% 18% / .6)); }
  .body > * { position: relative; z-index: 1; }
  .title { font-weight: 800; font-size: 1.15rem; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none; }
  .title:hover { text-decoration: underline; }
  .artist { font-weight: 700; color: var(--c2); font-size: .92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .desc { color: var(--c3); font-size: .82rem; margin: 2px 0 0; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { margin-top: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: .78rem; color: var(--c2); font-weight: 700; }
  .stat { display: inline-flex; align-items: center; gap: 4px; }
  .status { font-weight: 900; font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; padding: 1px 8px; border-radius: 999px; color: #2a1e24; }
  .status.live { background: var(--lime); }
  .status.wip { background: var(--orange); }
  .dots { display: inline-flex; gap: 3px; }
  .dot { width: 9px; height: 16px; border-radius: 999px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
  .chip { font-size: .72rem; font-weight: 800; text-decoration: none; padding: 1px 8px; border-radius: 999px; background: hsl(0 0% 100% / .08); color: var(--c2); }
  .chip:hover { background: hsl(0 0% 100% / .16); color: var(--c1); }
  .side { flex: none; width: 0; display: flex; flex-direction: column; background: var(--b4); transition: width .15s ease; overflow: hidden; }
  .card:hover .side, .card:focus-within .side { width: 44px; }
  .act { flex: 1; display: grid; place-items: center; color: var(--c2); text-decoration: none; }
  .act:hover { background: var(--b5); color: var(--c1); }
  .empty { display: none; text-align: center; padding: 60px 16px; color: var(--c3); font-weight: 700; }
  .empty b { display: block; font-size: 1.3rem; color: var(--c2); margin-bottom: 4px; }

  footer { max-width: 1240px; margin: 0 auto; padding: 24px 16px 40px; color: var(--c3); font-size: .85rem; display: flex; gap: 16px; flex-wrap: wrap; }
  footer a { color: var(--c2); text-decoration: none; }
  footer a:hover { color: var(--pink); }

  @media (max-width: 620px) {
    .nav-links { display: none; }
    .frow { grid-template-columns: 1fr; gap: 2px; }
    .card { height: 118px; }
    .thumb { width: 92px; }
    .sbox kbd { display: none; }
    .desc { display: none; }
    .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .search, .sortbar, .strip { padding-left: 14px; padding-right: 14px; }
  }
  @media (hover: none) { .side { width: 44px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
const SUBJECT_COLOURS = { physics: '#66ccff', chemistry: '#b3ff66', biology: '#ff66ab', astronomy: '#a78bfa', rhythm: '#ffd966', economy: '#ff9966' };

const PROJECTS = [
  { id: 'sao', title: 'Firmament', subtitle: 'space corporation on the real night sky', type: 'game', genre: ['strategy'], subject: ['astronomy'],
    status: 'live', updated: '2026-10-26', href: '/SAO/', repo: 'SAO', cta: 'Play',
    desc: 'Found a space company on one star and colonise all 88 constellations; research real technology and catalogue the Messier objects.' },
  { id: 'chemcorp', title: 'ChemCorp', subtitle: 'organic chemistry idle lab', type: 'game', genre: ['idle', 'learning'], subject: ['chemistry'],
    status: 'live', updated: '2026-10-30', href: '/chemcorp/', repo: 'chemcorp', cta: 'Play',
    desc: 'Run real reactions, research 111 of them, learn in the Academy and automate a plant.' },
  { id: 'biohub', title: 'Cytos', subtitle: 'cell biology idle game', type: 'game', genre: ['idle', 'learning'], subject: ['biology'],
    status: 'live', updated: '2026-11-01', href: '/biohub/', repo: 'biohub', cta: 'Play',
    desc: 'Express genes, build organelles, run the electron transport chain, fight viruses, replicate and evolve.' },
  { id: 'physbook', title: 'Physbook', subtitle: 'interactive physics textbook', type: 'textbook', genre: ['learning'], subject: ['physics'],
    status: 'live', updated: '2026-11-21', href: '/physbook/', repo: 'physbook', cta: 'Start learning',
    desc: '21 chapters from units to nuclear physics, 25 labs and 231 scored problems that climb to olympiad level.' },
  { id: 'sypt', title: 'Cold drink', subtitle: 'SYPT 2027 · problem B8', type: 'simulator', genre: ['learning'], subject: ['physics'],
    status: 'live', updated: '2026-10-30', href: '/sypt/', repo: 'sypt', cta: 'Open simulator',
    desc: 'How fast a can cools in ice, water and salt: a browser simulator and the write-ups behind it.',
    extra: [
      ['Strong case', '/sypt/b8-cold-drink/B8_strong_case.pdf'],
      ['Report', '/sypt/b8-cold-drink/B8-salted-ice-bath.pdf'],
      ['Derivation', '/sypt/b8-cold-drink/B8-model-derivation.pdf'],
      ['Salt–ice model', '/sypt/b8-cold-drink/sypt_salt_ice_model.pdf'],
    ] },
  { id: 'aimtrain', title: 'Aimtrain', subtitle: 'aim, mania, taiko and orbit trainer', type: 'trainer', genre: ['rhythm'], subject: ['rhythm'],
    status: 'live', updated: '2026-11-21', href: '/aimtrain/', repo: 'aimtrain', cta: 'Play',
    desc: 'Rhythm-game drills in four modes with adaptive difficulty, synced music and saved records.' },
  { id: 'toomanyupgrades', title: 'Too Many Upgrades', subtitle: 'resource management game', type: 'game', genre: ['idle'], subject: ['economy'],
    status: 'live', updated: '2025-12-15', href: '/TooManyUpgrades/', repo: 'TooManyUpgrades', cta: 'Play',
    desc: 'Gather wood, stone and iron, build producers and climb the technology tree.' },
  { id: 'florr', title: 'florr horizons', subtitle: 'incremental florr game', type: 'game', genre: ['idle'], subject: [],
    status: 'wip', updated: '2026-07-23', href: '/florr/', repo: 'florr', cta: 'Open',
    desc: 'An incremental game in early development.', cover: 'linear-gradient(135deg, #3b8f4e, #1f4f6b)' },
];

const ICON = {
  play: '<svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',
  playSm: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',
  code: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 7-5 5 5 5M16 7l5 5-5 5"/></svg>',
  clock: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  doc: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg>',
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function ago(iso) {
  const days = Math.max(0, Math.round((Date.now() - new Date(iso + 'T12:00:00Z')) / 864e5));
  if (days < 1) return 'today';
  if (days < 30) return days + (days === 1 ? ' day' : ' days') + ' ago';
  const months = Math.round(days / 30.4);
  if (months < 12) return months + (months === 1 ? ' month' : ' months') + ' ago';
  const years = Math.round(days / 365);
  return years + (years === 1 ? ' year' : ' years') + ' ago';
}

function coverOf(p) { return p.cover || `url(covers/${p.id}.jpg)`; }

function card(p) {
  const cover = coverOf(p);
  const subjects = p.subject.length ? p.subject : ['none'];
  const dots = subjects.map(s => `<span class="dot" style="background:${SUBJECT_COLOURS[s] || 'var(--c3)'}" title="${esc(s)}"></span>`).join('');
  const extra = (p.extra || []).map(([label, url]) => `<a class="chip" href="${esc(url)}">${ICON.doc.replace('aria-hidden', 'style="display:inline;vertical-align:-1px" aria-hidden')} ${esc(label)}</a>`).join('');
  return `<article class="card" style="--cover:${cover}">
    <a class="thumb" href="${esc(p.href)}" style="background-image:${cover}" aria-label="${esc(p.cta)}: ${esc(p.title)}"><span class="pl">${ICON.play}</span></a>
    <div class="body">
      <a class="title" href="${esc(p.href)}">${esc(p.title)}</a>
      <div class="artist">${esc(p.subtitle)}</div>
      <p class="desc">${esc(p.desc)}</p>
      ${extra ? `<div class="chips">${extra}</div>` : ''}
      <div class="meta">
        <span class="status ${p.status}">${p.status === 'live' ? 'live' : 'wip'}</span>
        <span class="dots">${dots}</span>
        <span class="stat">${esc(p.type)}</span>
        <span class="stat" title="Last updated ${esc(p.updated)}">${ICON.clock}${ago(p.updated)}</span>
      </div>
    </div>
    <div class="side">
      <a class="act" href="${esc(p.href)}" title="${esc(p.cta)}" aria-label="${esc(p.cta)}">${ICON.playSm}</a>
      <a class="act" href="https://github.com/darkpyxlz/${esc(p.repo)}" title="Source on GitHub" aria-label="Source of ${esc(p.title)} on GitHub">${ICON.code}</a>
    </div>
  </article>`;
}

const state = { q: '', type: '', genre: '', subject: '', status: '', sort: 'updated', dir: -1, seed: Math.random() };
const grid = document.getElementById('grid');
const q = document.getElementById('q');

function haystack(p) {
  return [p.title, p.subtitle, p.desc, p.type, p.repo, ...p.genre, ...p.subject, p.status, ...(p.extra || []).map(e => e[0] + ' pdf')].join(' ').toLowerCase();
}

function render() {
  const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  let list = PROJECTS.filter(p =>
    (!state.type || p.type === state.type) &&
    (!state.genre || p.genre.includes(state.genre)) &&
    (!state.subject || p.subject.includes(state.subject)) &&
    (!state.status || p.status === state.status) &&
    terms.every(t => haystack(p).includes(t)));
  const key = { title: p => p.title.toLowerCase(), updated: p => p.updated, type: p => p.type + p.title.toLowerCase(),
                random: p => Math.sin(state.seed * 1e4 + p.id.length * 97 + p.id.charCodeAt(0) * 13) };
  const k = key[state.sort];
  list.sort((a, b) => (k(a) > k(b) ? 1 : k(a) < k(b) ? -1 : 0) * state.dir);
  grid.innerHTML = list.map(card).join('');
  document.getElementById('empty').style.display = list.length ? 'none' : 'block';
  document.getElementById('count').textContent = list.length + (list.length === 1 ? ' project' : ' projects');
  const first = list.find(p => !p.cover) || PROJECTS[0];
  document.getElementById('searchBg').style.backgroundImage = coverOf(first);
  syncUrl();
}

function syncUrl() {
  const params = new URLSearchParams();
  for (const k of ['q', 'type', 'genre', 'subject', 'status']) if (state[k]) params.set(k, state[k]);
  if (state.sort !== 'updated' || state.dir !== -1) params.set('sort', state.sort + (state.dir === 1 ? '_asc' : '_desc'));
  const s = params.toString();
  history.replaceState(null, '', s ? '?' + s : location.pathname);
}

function setOpt(filter, value) {
  state[filter] = value;
  document.querySelectorAll(`[data-filter="${filter}"] .opt`).forEach(b => {
    b.classList.toggle('on', b.dataset.v === value);
    b.setAttribute('aria-pressed', b.dataset.v === value);
  });
}

function setSort(sort, dir) {
  state.sort = sort; state.dir = dir;
  document.querySelectorAll('.sort').forEach(b => {
    const on = b.dataset.sort === sort;
    b.classList.toggle('on', on);
    b.querySelector('.ar').textContent = dir === 1 ? '▲' : '▼';
  });
}

document.querySelectorAll('[data-filter]').forEach(group => {
  group.addEventListener('click', e => {
    const b = e.target.closest('.opt'); if (!b) return;
    const f = group.dataset.filter;
    setOpt(f, state[f] === b.dataset.v ? '' : b.dataset.v);
    render();
  });
});

document.querySelectorAll('.sort').forEach(b => b.addEventListener('click', () => {
  const s = b.dataset.sort;
  if (s === 'random') { state.seed = Math.random(); setSort(s, 1); }
  else setSort(s, state.sort === s ? -state.dir : (s === 'updated' ? -1 : 1));
  render();
}));

document.querySelectorAll('[data-quick]').forEach(a => a.addEventListener('click', e => {
  e.preventDefault();
  ['type', 'genre', 'subject', 'status'].forEach(f => setOpt(f, ''));
  const [f, v] = a.dataset.quick.split(':');
  setOpt(f, v);
  document.querySelectorAll('.nav-links a').forEach(x => x.classList.toggle('on', x === a));
  render();
}));
document.querySelector('.nav-links a[href="/"]').addEventListener('click', e => {
  e.preventDefault();
  ['type', 'genre', 'subject', 'status'].forEach(f => setOpt(f, ''));
  q.value = state.q = '';
  document.querySelectorAll('.nav-links a').forEach((x, i) => x.classList.toggle('on', i === 0));
  render();
});

let t;
q.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { state.q = q.value.trim(); render(); }, 80); });
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  else if (e.key === 'Escape' && document.activeElement === q) { q.value = ''; state.q = ''; render(); q.blur(); }
});

// restore from URL
const params = new URLSearchParams(location.search);
for (const f of ['type', 'genre', 'subject', 'status']) if (params.get(f)) setOpt(f, params.get(f));
if (params.get('q')) q.value = state.q = params.get('q');
const sp = (params.get('sort') || '').match(/^(title|updated|type|random)_(asc|desc)$/);
setSort(sp ? sp[1] : 'updated', sp ? (sp[2] === 'asc' ? 1 : -1) : -1);
render();
</script>
</body>
</html>
